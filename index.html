<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diva Test</title><style>body{font-family:Arial;margin:0;background:#fff5fb;color:#35172a}.h{background:#8e326b;color:#fff;padding:20px;text-align:center;font-size:24px;font-weight:bold}.b{padding:15px;display:flex;gap:8px;flex-wrap:wrap}.b button{padding:14px 18px;border:0;border-radius:10px;background:#65184b;color:#fff;font-weight:bold}.p{display:none;padding:20px}.p.on{display:block}.box{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0002}input{padding:12px;width:100%;box-sizing:border-box;margin:8px 0;border:1px solid #bbb;border-radius:8px}.gold{background:#d5a54a!important;color:#111!important}</style></head><body><div class="h">👑 Diva Collection Billing</div><div class="b"><button id="d">Dashboard</button><button id="bill">Billing</button><button id="stock">Stock</button><button id="test" class="gold">Button Test</button></div><section id="dashboard" class="p on"><div class="box"><h2>Dashboard</h2><p>App working hai.</p><p id="saved">Data: 0</p><button id="save" class="gold">Save Test Data</button></div></section><section id="billing" class="p"><div class="box"><h2>Billing</h2><input id="name" placeholder="Customer name"><button id="add" class="gold">Add Bill</button><p id="msg"></p></div></section><section id="stocks" class="p"><div class="box"><h2>Stock</h2><p>Stock section working hai.</p></div></section><section id="bt" class="p"><div class="box"><h2>Button Test</h2><p id="result">Button dabaiye.</p></div></section><script>const q=id=>document.getElementById(id);function page(id){document.querySelectorAll('.p').forEach(x=>x.classList.remove('on'));q(id).classList.add('on')}q('d').onclick=()=>page('dashboard');q('bill').onclick=()=>page('billing');q('stock').onclick=()=>page('stocks');q('test').onclick=()=>{page('bt');q('result').textContent='Button 100% working ✓'};q('save').onclick=()=>{localStorage.setItem('D

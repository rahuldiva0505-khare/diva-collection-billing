<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diva Collection Billing</title><style>body{margin:0;font-family:Arial,sans-serif;background:#fff5fb;color:#35172a}.top{background:#8e326b;color:white;padding:18px;text-align:center;font-size:24px;font-weight:700}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fff;border-bottom:1px solid #ddd}.nav button{padding:12px 16px;border:0;border-radius:10px;background:#65184b;color:white;font-weight:700}.page{display:none;padding:16px}.page.active{display:block}.card{background:white;padding:16px;border-radius:14px;margin:10px 0;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{font-size:24px;font-weight:700}.input{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:9px}button.action{padding:10px 14px;border:0;border-radius:9px;background:#d5a54a;color:#211;font-weight:700;margin:4px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><div class="top">👑 Diva Collection Billing</div><div class="nav"><button onclick="show('dashboard')">Dashboard</button><button onclick="show('billing')">Billing</button><button onclick="show('stock')">Stock</button><button onclick="show('purchase')">Purchase</button><button onclick="show('reports')">Reports</button></div><main><section id="dashboard" class="page active"><h2>Dashboard</h2><div class="grid"><div class="card">Today's Bills<div id="billCount" class="stat">0</div></div><div class="card">Today's Sales<div id="salesTotal" class="stat">₹0</div></div><div class="card">Products<div id="productCount" class="stat">0</div></div></div><div class="card"><h3>Data Status</h3><p id="status">Local data ready</p><button class="action" onclick="saveData()">Save Data</button><button class="action" onclick="resetDemo()">Reset Demo Data</button></div></section><section id="billing" class="page"><h2>Billing</h2><div class="card"><input id="customer" class="input" placeholder="Customer name"><input id="item" class="input" placeholder="Product name"><input id="qty" class="input" type="number" min="1" value="1"><input id="price" class="input" type="number" min="0" value="0"><button class="action" onclick="addBill()">Add Bill</button><div id="billMsg"></div></div><div class="card"><h3>Recent Bills</h3><table><thead><tr><th>Customer</th><th>Item</th><th>Qty</th><th>Total</th></tr></thead><tbody id="billTable"></tbody></table></div></section><section id="stock" class="page"><h2>Stock</h2><div class="card"><input id="stockName" class="input" placeholder="Product name"><input id="stockQty" class="input" type="number" min="0" value="1"><button class="action" onclick="addStock()">Add Stock</button></div><div class="card"><table><thead><tr><th>Product</th><th>Qty</th></tr></thead><tbody id="stockTable"></tbody></table></div></section><section id="purchase" class="page"><h2>Purchase</h2><div class="card"><input id="purchaseName" class="input" placeholder="Product name"><input id="purchaseQty" class="input" type="number" min="1" value="1"><input id="purchaseCost" class="input" type="number" min="0" value="0"><button class="action" onclick="addPurchase()">Add Purchase</button><div id="purchaseMsg"></div></div></section><section id="reports" class="page"><h2>Reports</h2><div class="grid"><div class="card">Total Bills<div id="reportBills" class="stat">0</div></div><div class="card">Total Sales<div id="reportSales" class="stat">₹0</div></div><div class="card">Purchase Cost<div id="reportPurchase" class="stat">₹0</div></div><div class="card">Gross Profit<div id="reportProfit" class="stat">₹0</div></div></div></section></main><script>const KEY='DIVA_COLLECTION_CLEAN_V1';let data=JSON.parse(localStorage.getItem(KEY)||'{"bills":[],"stock":[],"purchases":[]}');function saveData(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('status').textContent='Saved locally ✓';render()}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');render()}function addBill(){const customer=document.getElementById('customer').value.trim()||'Walk-in';const item=document.getElementById('item').value.trim();const qty=Math.max(1,Number(document.getElementById('qty').value)||1);const price=Math.max(0,Number(document.getElementById('price').value)||0);if(!item){document.getElementById('billMsg').textContent='Product name डालें';return}data.bills.push({customer,item,qty,price,total:qty*price,date:new Date().toISOString()});saveData();document.getElementById('billMsg').textContent='Bill saved ✓';document.getElementById('customer').value='';document.getElementById('item').value='';}function addStock(){const name=document.getElementById('stockName').value.trim();const qty=Math.max(0,Number(document.getElementById('stockQty').value)||0);if(!name)return;const p=data.stock.find(x=>x.name.toLowerCase()===name.toLowerCase());if(p)p.qty+=qty;else data.stock.push({name,qty});saveData();document.getElementById('stockName').value='';}function addPurchase(){const name=document.getElementById('purchaseName').value.trim();const qty=Math.max(1,Number(document.getElementById('purchaseQty').value)||1);const cost=Math.max(0,Number(document.getElementById('purchaseCost').value)||0);if(!name)return;data.purchases.push({name,qty,cost,total:qty*cost,date:new Date().toISOString()});const p=data.stock.find(x=>x.name.toLowerCase()===name.toLowerCase());if(p)p.qty+=qty;else data.stock.push({name,qty});saveData();document.getElementById('purchaseMsg').textContent='Purchase saved ✓';}function resetDemo(){if(confirm('Demo data reset करें?')){data={bills:[],stock:[],purchases:[]};saveData()}}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function render(){const sales=data.bills.reduce((s,b)=>s+b.total,0),pc=data.purchases.reduce((s,p)=>s+p.total,0);document.getElementById('billCount').textContent=data.bills.length;document.getElementById('salesTotal').textContent=money(sales);document.getElementById('productCount').textContent=data.stock.length;document.getElementById('reportBills').textContent=data.bills.length;document.getElementById('reportSales').textContent=money(sales);document.getElementById('reportPurchase').textContent=money(pc);document.getElementById('reportProfit').textContent=money(sales-pc);document.getElementById('billTable').innerHTML=data.bills.slice(-20).reverse().map(b=>'<tr><td>'+esc(b.customer)+'</td><td>'+esc(b.item)+'</td><td>'+b.qty+'</td><td>'+money(b.total)+'</td></tr>').join('');document.getElementById('stockTable').innerHTML=data.stock.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.qty+'</td></tr>').join('')}function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}render();</script></body></html>

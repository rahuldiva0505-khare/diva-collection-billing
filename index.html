<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e91e63"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<title>Diva Collection Billing • Barcode V2</title><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js?v=61',{updateViaCache:'none'}).then(function(reg){
      reg.update().catch(function(){});
      if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'});}
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;
        if(nw) nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){nw.postMessage({type:'SKIP_WAITING'});}
        });
      });
    }).catch(function(){});
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!window.__DIVA_RELOADED){window.__DIVA_RELOADED=true;window.location.reload();}
    });
  });
}
</script>
